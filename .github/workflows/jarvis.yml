
name: JARVIS Assistant

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get JARVIS source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore JARVIS AI cache
        uses: actions/cache@v4
        with:
          path: |
            models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
            llama.cpp/build/
          key: jarvis-qwen3-06b-v1

      - name: Verify AI files
        run: |
          test -s models/Qwen_Qwen3-0.6B-Q4_K_M.gguf
          test -x llama.cpp/build/bin/llama-cli
          echo "JARVIS AI engine is ready."

      - name: Start JARVIS
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jarvis.py
