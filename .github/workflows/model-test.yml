
name: JARVIS AI Model Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get JARVIS source code
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev

      - name: Build llama.cpp
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON
          cmake --build llama.cpp/build --config Release -j2

           - name: Download Qwen3 0.6B
        run: |
          mkdir -p models
          python -m pip install -U huggingface_hub
          hf download bartowski/Qwen_Qwen3-0.6B-GGUF \
            Qwen_Qwen3-0.6B-Q4_K_M.gguf \
            --local-dir models
          ls -lh models/Qwen_Qwen3-0.6B-Q4_K_M.gguf

      - name: Run first AI test
        run: |
          llama.cpp/build/bin/llama-cli \
            -m models/Qwen_Qwen3-0.6B-Q4_K_M.gguf \
            -p "You are JARVIS, a helpful personal AI assistant. Introduce yourself in two sentences." \
            -n 100 \
            -c 2048
