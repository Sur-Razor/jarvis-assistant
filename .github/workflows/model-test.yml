
name: JARVIS AI Model Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Get JARVIS source code
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Restore AI model and engine cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/qwen3-4b.gguf
            llama.cpp/build/
          key: jarvis-qwen3-4b-llama-v1

      - name: Install build dependencies
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcurl4-openssl-dev

      - name: Build llama.cpp
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=ON
          cmake --build llama.cpp/build --config Release -j2

      - name: Download Qwen3 4B
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          python -m pip install -U huggingface_hub
          hf download bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF \
            Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
            --local-dir models
          mv models/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf models/qwen3-4b.gguf

      - name: Verify AI engine
        run: |
          test -s models/qwen3-4b.gguf
          test -x llama.cpp/build/bin/llama-cli
          test -x llama.cpp/build/bin/llama-server

      - name: Run first AI test
        run: |
          llama.cpp/build/bin/llama-cli \
            -m models/qwen3-4b.gguf \
            -p "You are JARVIS, a helpful personal AI assistant. Introduce yourself in two sentences." \
            -n 100 \
            -c 2048
